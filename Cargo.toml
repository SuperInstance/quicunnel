[workspace]

[package]
name = "quicunnel"
version = "0.1.0"
edition = "2021"
authors = ["SuperInstance AI"]
description = "QUIC tunnel client library (quinn + rustls) with mTLS, a validated connection state machine, heartbeat sender, and reconnection primitives"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SuperInstance/quicunnel"
readme = "README.md"
keywords = ["quic", "tunnel", "networking", "mtls", "performance"]
categories = ["network-programming", "asynchronous"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Logging
tracing = "0.1"

# Time
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"

# QUIC/TLS
quinn = "0.11"
rustls = "0.23"
rustls-pemfile = "2.2"
webpki-roots = "1.0"
rcgen = "0.14"

# For data structures
bytes = "1.5"

# For URL parsing
url = "2.5"

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.8"
tracing-subscriber = "0.3"

[lib]
name = "quicunnel"
path = "src/lib.rs"

# Benchmarks
[[bench]]
name = "tunnel"
harness = false
